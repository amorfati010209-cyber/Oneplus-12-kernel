name: Build NetHunter Kernel — OnePlus 12 (Android 16)

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      with_ksu:
        description: 'Include KernelSU'
        required: true
        default: 'true'
        type: boolean

env:
  ARCH: arm64
  # OnePlus official GKI common kernel for OOS 16 (Android 16 / B release)
  KERNEL_REPO: https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8650
  KERNEL_BRANCH: oneplus/sm8650_b_16.0.0_oneplus12
  AK3_REPO: https://github.com/osm0sis/AnyKernel3

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      OUT_DIR: ${{ github.workspace }}/out

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison build-essential flex \
            git libelf-dev libssl-dev lz4 python3 \
            zip unzip wget curl aria2 cpio \
            pahole dwarves

      - name: Install Clang and LLVM tools
        run: |
          # Try LLVM 17 from official PPA; fall back to system clang-14
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main" \
            | sudo tee /etc/apt/sources.list.d/llvm17.list
          sudo apt-get update -qq

          if sudo apt-get install -y clang-17 lld-17 llvm-17 2>/dev/null \
             && command -v clang-17 &>/dev/null; then
            VER=17
            echo "[+] Clang 17 installed from LLVM PPA"
          else
            echo "[!] LLVM 17 PPA failed — using system clang-14"
            sudo apt-get install -y clang-14 lld-14 llvm-14
            VER=14
          fi

          # Force-create /usr/bin/clang and /usr/bin/ld.lld symlinks
          # (update-alternatives only creates /usr/bin/lld, NOT /usr/bin/ld.lld)
          sudo ln -sfn "/usr/bin/clang-${VER}"   /usr/bin/clang
          sudo ln -sfn "/usr/bin/ld.lld-${VER}"  /usr/bin/ld.lld
          for tool in ar nm objcopy objdump strip readelf; do
            [ -f "/usr/bin/llvm-${tool}-${VER}" ] && \
              sudo ln -sfn "/usr/bin/llvm-${tool}-${VER}" "/usr/bin/llvm-${tool}" || true
          done

          echo "[+] clang  : $(clang  --version | head -1)"
          echo "[+] ld.lld : $(ld.lld --version 2>&1 | head -1)"
          echo "CC_VERSION=$(clang --version | head -1)" >> $GITHUB_ENV

      - name: Install aarch64 cross-compiler
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Cache kernel source
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: kernel_source
          key: kernel-op12-oos16-${{ env.KERNEL_BRANCH }}-${{ hashFiles('patches/*.patch') }}
          restore-keys: |
            kernel-op12-oos16-${{ env.KERNEL_BRANCH }}-

      - name: Clone OnePlus 12 GKI kernel (OOS 16)
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          echo "[*] Cloning OnePlus GKI kernel (OOS16 / Android 16)..."
          git clone --depth=1 \
            --branch "${{ env.KERNEL_BRANCH }}" \
            "${{ env.KERNEL_REPO }}" \
            kernel_source
          echo "[+] Kernel version:"
          head -5 kernel_source/Makefile

      - name: Verify kernel source
        run: |
          echo "=== Kernel version ==="
          head -5 kernel_source/Makefile
          echo ""
          echo "=== Available configs ==="
          ls kernel_source/arch/arm64/configs/

      - name: Integrate KernelSU
        if: ${{ github.event.inputs.with_ksu != 'false' }}
        run: |
          echo "[*] Integrating KernelSU via setup.sh..."
          cd kernel_source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s main
          KSU_VER=$(cd KernelSU && git describe --tags --abbrev=0 2>/dev/null || echo "latest")
          echo "KSU_VERSION=$KSU_VER" >> $GITHUB_ENV
          echo "[+] KernelSU $KSU_VER integrated"

      - name: Apply NetHunter patches
        run: |
          cd kernel_source
          APPLIED=0
          SKIPPED=0
          for patch in $GITHUB_WORKSPACE/patches/*.patch; do
            [ -f "$patch" ] || continue
            name=$(basename "$patch")
            if git apply --check --ignore-whitespace "$patch" 2>/dev/null; then
              git apply --ignore-whitespace "$patch"
              echo "  [+] Applied: $name"
              APPLIED=$((APPLIED+1))
            else
              echo "  [~] Skipped: $name"
              SKIPPED=$((SKIPPED+1))
            fi
          done
          echo "[*] Patches: $APPLIED applied, $SKIPPED skipped"

      - name: Generate .config
        run: |
          mkdir -p "$OUT_DIR"
          echo "[*] Building gki_defconfig..."
          make -C kernel_source \
            O="$OUT_DIR" \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig
          echo "[+] Base config: $(wc -l < "$OUT_DIR/.config") lines"

      - name: Merge NetHunter config fragments
        run: |
          echo "[*] Merging NetHunter config..."

          # Disable header install (key fix — avoids hours of HDRINST slowdown)
          echo "CONFIG_HEADERS_INSTALL=n" >> nethunter-config/nethunter.config

          kernel_source/scripts/kconfig/merge_config.sh -m \
            -O "$OUT_DIR" \
            "$OUT_DIR/.config" \
            nethunter-config/nethunter.config \
            nethunter-config/nethunter-wifi.config

          make -C kernel_source \
            O="$OUT_DIR" \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            olddefconfig

          echo ""
          echo "[*] NetHunter feature check:"
          for key in \
            CONFIG_USB_CONFIGFS_F_HID \
            CONFIG_CFG80211 \
            CONFIG_MAC80211 \
            CONFIG_TUN \
            CONFIG_KSU \
            CONFIG_BT \
            CONFIG_NETFILTER \
            CONFIG_HEADERS_INSTALL; do
            val=$(grep "^${key}[=]" "$OUT_DIR/.config" 2>/dev/null | cut -d= -f2 \
                  || grep "^# ${key} " "$OUT_DIR/.config" 2>/dev/null | head -1 \
                  || echo "NOT SET")
            printf "  %-40s %s\n" "$key" "$val"
          done

      - name: Build kernel image
        run: |
          echo "[*] Building with $(nproc) jobs..."
          BUILD_START=$(date +%s)

          make -C kernel_source \
            O="$OUT_DIR" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-O2 -Wno-error" \
            -j$(nproc) \
            Image

          BUILD_END=$(date +%s)
          echo "[+] Build done in $((BUILD_END - BUILD_START))s"
          ls -lh "$OUT_DIR/arch/arm64/boot/Image"

          # Compress to lz4 for AnyKernel3
          lz4 -9 -f "$OUT_DIR/arch/arm64/boot/Image" \
                    "$OUT_DIR/arch/arm64/boot/Image.lz4" || true

      - name: Clone AnyKernel3
        run: git clone --depth=1 "${{ env.AK3_REPO }}" AnyKernel3

      - name: Package flashable ZIP
        run: |
          # Use Image.lz4 if available, else raw Image
          if [ -f "$OUT_DIR/arch/arm64/boot/Image.lz4" ]; then
            cp "$OUT_DIR/arch/arm64/boot/Image.lz4" AnyKernel3/
          else
            cp "$OUT_DIR/arch/arm64/boot/Image" AnyKernel3/
          fi
          cp anykernel3/anykernel.sh AnyKernel3/anykernel.sh

          mkdir -p dist
          ZIP_NAME="NetHunter-KernelSU-OnePlus12-OOS16-$(date +%Y%m%d).zip"
          cd AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/dist/${ZIP_NAME}" . -x "*.git*" -x "*.DS_Store"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "[+] Packaged: dist/${ZIP_NAME}"

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-kernel-oneplus12-zip
          path: dist/*.zip
          retention-days: 30

      - name: Upload kernel image (raw)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: ${{ env.OUT_DIR }}/arch/arm64/boot/Image*
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "## NetHunter Kernel Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Device | OnePlus 12 (SM8650 / CPH2573) |" >> $GITHUB_STEP_SUMMARY
          echo "| OS | OxygenOS 16 (Android 16) |" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel source | OnePlusOSS GKI common sm8650_b_16 |" >> $GITHUB_STEP_SUMMARY
          echo "| KernelSU | ${{ env.KSU_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Clang | ${{ env.CC_VERSION }} |" >> $GITHUB_STEP_SUMMARY
