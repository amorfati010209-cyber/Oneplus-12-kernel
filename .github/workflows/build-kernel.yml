name: Build NetHunter Kernel — OnePlus 12 (Android 16)

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      with_ksu:
        description: 'Include KernelSU'
        required: true
        default: 'true'
        type: boolean

env:
  ARCH: arm64
  SUBARCH: arm64
  # AOSP GKI android14-6.1 — small, fast, GKI-compatible with OnePlus 12
  KERNEL_REPO: https://android.googlesource.com/kernel/common
  KERNEL_BRANCH: android14-6.1
  KSU_REPO: https://github.com/tiann/KernelSU
  AK3_REPO: https://github.com/osm0sis/AnyKernel3

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      OUT_DIR: ${{ github.workspace }}/out

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison build-essential flex \
            git libelf-dev libssl-dev lz4 python3 \
            zip unzip wget curl cpio \
            pahole dwarves
          sudo apt-get install -y clang lld llvm
          clang --version
          echo "CC_VERSION=$(clang --version | head -1)" >> $GITHUB_ENV

      - name: Install aarch64 cross-compiler
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          aarch64-linux-gnu-gcc --version

      - name: Cache kernel source
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: kernel_source
          key: kernel-gki-${{ env.KERNEL_BRANCH }}-${{ hashFiles('patches/*.patch') }}
          restore-keys: |
            kernel-gki-${{ env.KERNEL_BRANCH }}-
            kernel-gki-

      - name: Clone AOSP GKI kernel
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          echo "[*] Cloning AOSP GKI android14-6.1..."
          git clone --depth=1 \
            --branch "${{ env.KERNEL_BRANCH }}" \
            "${{ env.KERNEL_REPO }}" \
            kernel_source
          echo "[+] Cloned: $(head -3 kernel_source/Makefile)"

      - name: Verify kernel source
        run: |
          echo "=== Kernel version ==="
          head -5 kernel_source/Makefile
          echo ""
          echo "=== Available configs ==="
          ls kernel_source/arch/arm64/configs/ | head -20

      - name: Integrate KernelSU
        if: ${{ github.event.inputs.with_ksu != 'false' }}
        run: |
          echo "[*] Integrating KernelSU into GKI kernel..."
          cd kernel_source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          KSU_VER=$(cd KernelSU && git describe --tags --abbrev=0 2>/dev/null || echo "latest")
          echo "KSU_VERSION=$KSU_VER" >> $GITHUB_ENV
          echo "[+] KernelSU $KSU_VER integrated"

      - name: Apply NetHunter patches
        run: |
          cd kernel_source
          APPLIED=0
          SKIPPED=0
          for patch in $GITHUB_WORKSPACE/patches/*.patch; do
            [ -f "$patch" ] || continue
            name=$(basename "$patch")
            if git apply --check --ignore-whitespace "$patch" 2>/dev/null; then
              git apply --ignore-whitespace "$patch"
              echo "  [+] Applied: $name"
              APPLIED=$((APPLIED+1))
            else
              echo "  [~] Skipped: $name"
              SKIPPED=$((SKIPPED+1))
            fi
          done
          echo "[*] Patches: $APPLIED applied, $SKIPPED skipped"

      - name: Generate .config
        run: |
          mkdir -p "$OUT_DIR"
          echo "[*] Building gki_defconfig..."
          make -C kernel_source \
            O="$OUT_DIR" \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            gki_defconfig
          echo "[+] Base config: $(wc -l < "$OUT_DIR/.config") lines"

      - name: Merge NetHunter config fragments
        run: |
          echo "[*] Merging NetHunter config..."
          kernel_source/scripts/kconfig/merge_config.sh -m \
            -O "$OUT_DIR" \
            "$OUT_DIR/.config" \
            nethunter-config/nethunter.config \
            nethunter-config/nethunter-wifi.config

          make -C kernel_source \
            O="$OUT_DIR" \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            olddefconfig

          echo ""
          echo "[*] NetHunter feature check:"
          for key in \
            CONFIG_USB_CONFIGFS_F_HID \
            CONFIG_CFG80211 \
            CONFIG_MAC80211 \
            CONFIG_TUN \
            CONFIG_KSU \
            CONFIG_BT \
            CONFIG_NETFILTER; do
            val=$(grep "^${key}=" "$OUT_DIR/.config" 2>/dev/null | cut -d= -f2 || echo "NOT SET")
            printf "  %-40s %s\n" "$key" "$val"
          done

      - name: Build kernel image
        run: |
          echo "[*] Building with $(nproc) jobs..."
          BUILD_START=$(date +%s)

          make -C kernel_source \
            O="$OUT_DIR" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            -j$(nproc) \
            Image.lz4

          BUILD_END=$(date +%s)
          echo "[+] Build done in $((BUILD_END - BUILD_START))s"
          ls -lh "$OUT_DIR/arch/arm64/boot/Image.lz4"

      - name: Clone AnyKernel3
        run: git clone --depth=1 "${{ env.AK3_REPO }}" AnyKernel3

      - name: Package flashable ZIP
        run: |
          cp "$OUT_DIR/arch/arm64/boot/Image.lz4" AnyKernel3/
          cp anykernel3/anykernel.sh AnyKernel3/anykernel.sh

          mkdir -p dist
          ZIP_NAME="NetHunter-KernelSU-OnePlus12-Android16-$(date +%Y%m%d).zip"
          cd AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/dist/${ZIP_NAME}" . -x "*.git*" -x "*.DS_Store"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "[+] Packaged: dist/${ZIP_NAME}"

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-kernel-oneplus12-zip
          path: dist/*.zip
          retention-days: 30

      - name: Upload kernel image (raw)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-lz4
          path: ${{ env.OUT_DIR }}/arch/arm64/boot/Image.lz4
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "## NetHunter Kernel Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Device | OnePlus 12 (SM8650 / CPH2573) |" >> $GITHUB_STEP_SUMMARY
          echo "| Android | 16 (OxygenOS 16) |" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel | AOSP GKI android14-6.1 |" >> $GITHUB_STEP_SUMMARY
          echo "| KernelSU | ${{ env.KSU_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Clang | ${{ env.CC_VERSION }} |" >> $GITHUB_STEP_SUMMARY
